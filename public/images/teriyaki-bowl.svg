      <stop offset="0%" stop-color="#231912" />
      <stop offset="100%" stop-color="#0A0A0C" />
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bgTeri)" />

  <!-- Stoneware Donburi Bowl -->
  <circle cx="400" cy="305" r="215" fill="#16171B" stroke="#D4AF37" stroke-opacity="0.4" stroke-width="4" />
  <circle cx="400" cy="305" r="190" fill="#F8FAFC" />

